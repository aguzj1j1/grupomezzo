<section id="beneficios">
  <div class="wrap">
    <div class="section-head">
      <mezzo-eyebrow text="Para las empresas del parque" />
      <h2>Lo que cambia al operar dentro de un desarrollo de Grupo Mezzo.</h2>
    </div>

    <div class="benefits">
      @for (benefit of benefits; track benefit.title; let i = $index) {
        <div class="benefit" mezzoReveal [revealDelay]="(i % 3) * 80">
          <span class="glyph" aria-hidden="true"></span>
          <h3>{{ benefit.title }}</h3>
          <p>{{ benefit.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
