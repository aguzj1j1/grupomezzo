<ng-template #navItems let-onClick="onClick">
  @for (link of navLinks; track link.href) {
    <li>
      <a
        [href]="link.href"
        [class.active]="activeHref() === link.href"
        [attr.aria-current]="activeHref() === link.href ? 'true' : null"
        (click)="onClick && closeMenu()"
      >
        {{ link.label }}
      </a>
    </li>
  }
</ng-template>

<header>
  <div class="wrap bar">
    <a href="#top" class="mark" aria-label="Grupo Mezzo, inicio">
      <mezzo-logo-mark [size]="38" />
      <span class="brand-text">Grupo Me<strong>zzo</strong></span>
    </a>

    <nav class="nav-desktop" aria-label="Navegación principal">
      <ul>
        <ng-container *ngTemplateOutlet="navItems" />
      </ul>
      <a class="cta" href="#contacto">Hablar con nosotros</a>
    </nav>

    <button
      class="menu-btn"
      type="button"
      [class.is-open]="isMenuOpen()"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="mobileNav"
      [attr.aria-label]="isMenuOpen() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="toggleMenu()"
    >
      <span></span><span></span><span></span>
    </button>
  </div>

  @if (isMenuOpen()) {
    <nav id="mobileNav" class="nav-mobile" aria-label="Navegación móvil">
      <ul>
        <ng-container *ngTemplateOutlet="navItems; context: { onClick: true }" />
        <li><a href="#contacto" (click)="closeMenu()">Hablar con nosotros →</a></li>
      </ul>
    </nav>
  }
</header>
